<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090a0f" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  
  <!-- Outer glowing orbital ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="14" opacity="0.85" filter="url(#glow)" />
  
  <!-- Inner tactile button -->
  <circle cx="256" cy="256" r="120" fill="#131722" stroke="#2a3245" stroke-width="4" />
  
  <!-- Microphone Icon -->
  <g fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mic capsule -->
    <rect x="216" y="160" width="80" height="130" rx="40" fill="#ffffff" stroke="none" />
    <!-- Stand cradle -->
    <path d="M180 250 C180 300, 332 300, 332 250" />
    <!-- Stand stem -->
    <line x1="256" y1="300" x2="256" y2="350" />
    <!-- Stand base -->
    <line x1="206" y1="350" x2="306" y2="350" />
  </g>
</svg>
